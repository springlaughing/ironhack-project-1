# Ironhack note - This file is for running in docker compose with prebuilt images
# Use these if you're stuck, or if you want to start slowly migrating from external images into your own.

services:
  vote:
    build: ./vote
    image: ${REGISTRY_USER:-local}/voting-vote:${IMAGE_TAG:-dev}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped 
    ports:
      - "8080:80"
    networks:
      - back-tier

  result:
    build: ./result
    image: ${REGISTRY_USER:-local}/voting-result:${IMAGE_TAG:-dev}
    environment:
      PG_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "8081:80"
    networks:
      - back-tier

  worker:
    build: ./worker
    image: ${REGISTRY_USER:-local}/voting-worker:${IMAGE_TAG:-dev}
    environment:
      DB_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - back-tier

  redis:
    image: redis:alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - "redis-data:/data" 
      - "./healthchecks:/healthchecks"
    healthcheck:
      test: /healthchecks/redis.sh
      interval: "5s"
    restart: unless-stopped
    networks:
      - back-tier

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
    volumes:
      - "db-data:/var/lib/postgresql/data"
      - "./healthchecks:/healthchecks"
    healthcheck:
      test: /healthchecks/postgres.sh
      interval: "5s"
    restart: unless-stopped
    networks:
      - back-tier

volumes:
  db-data:
  redis-data:

networks:
  back-tier:
